<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction Flipper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="dot" id="live-dot"></span>
    <strong>Auction Flipper</strong>
    <span class="sub">live board</span>
  </div>
  <div class="stats">
    <div class="stat"><label>budget</label><span id="s-budget">-</span>
      <div class="gauge"><i id="s-gauge"></i></div>
    </div>
    <div class="stat"><label>book</label><span id="s-book">-</span></div>
    <div class="stat"><label>tape</label><span id="s-tape">-</span></div>
    <div class="stat"><label>new listings</label><span id="s-sniper">-</span></div>
    <div class="stat"><label>book scan</label><span id="s-scan">-</span></div>
    <div class="stat"><label>uptime</label><span id="s-uptime">-</span></div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="sorts" id="sorts">
      <button class="chip active" data-sort="score">Profit / hour</button>
      <button class="chip" data-sort="net">Net profit</button>
      <button class="chip" data-sort="roi">ROI</button>
      <button class="chip" data-sort="age">Newest</button>
    </div>
    <input id="filter" class="filter" type="search" placeholder="filter by item name" autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  <div id="rows" class="rows"></div>
  <p id="empty" class="empty">Waiting for the first flips. The tool needs a minute of sale history
     before it can price anything with confidence.</p>
</main>

<script src="app.js"></script>
</body>
</html>
